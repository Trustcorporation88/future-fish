services:
  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    # 加速镜像（如拉取缓慢可替换上方地址）
    # image: ghcr.nju.edu.cn/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      # 注意：后端接口没有身份验证。这样映射会把 5001 暴露到宿主机的所有网卡，
      # 同一局域网内的人都能直接调用。仅本机使用时建议改为：
      #   - "127.0.0.1:3000:3000"
      #   - "127.0.0.1:5001:5001"
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads